<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>塔位查詢</title>

  <!-- 保留原本 Excel / Google 試算表讀取方式 -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* =========================
       原本塔位樣式
    ========================= */

    .tower-zone {
      margin-bottom: 40px;
      position: relative;
    }

    .zone-label {
      font-size: 1.2em;
      margin: 10px 0;
      font-weight: bold;
    }

    .floor {
      display: flex;
      margin-bottom: 5px;
    }

    .tower {
      width: 70px;
      height: 70px;
      border: 1px solid #ccc;
      margin-right: 5px;
      background-color: #eee;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 0.7em;
      text-align: center;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .tower span.price {
      font-weight: normal;
      margin-top: 5px;
    }   

    .tower:hover:not(.taken):not(.selected):not(.justthis):not(.noselected):not(.item3):not(.item4):not(.item5) {
      background-color: #cce7ff;
    }

    .tower.item2:hover {
      color: #000!important;
    }

    .tower.item3:hover {
      cursor: auto!important;
    }


    .tower.taken {
      background-color: #999;
      cursor: not-allowed;
      color: white;
    }

    .tower.noselected {
      background-color: gray;
      cursor: not-allowed;
      color: white;
    }

    .red {
      color: red !important;
      background-color: pink !important;
    }

    .downCode {
      border-radius: 0 0 8px 8px;
      margin-top: -6px;
      height: 77px;
      border-color: gray;
    }

    .upCode {
      border-color: gray;
      border-bottom:0;
      position: absolute;
      height: 142px!important;
    }
    .upCode-col-0 {
      left: 60px;
    }
    .upCode-col-1 {
      left: 166px;
    }
    .upCode-col-2 {
      left: 272px;
    }                  

    .codeVerticalY {
      position: absolute;
      top: 44px;
    }


    /* =========================
       原本棟別選擇版面
    ========================= */

    .floor1 {
      width: 18rem;
      justify-content: space-between !important;
    }

    .tower.item1 {
      height: 38px;
      width: 140px;
    }

    .tower.item2 {
      height: 38px;
      background-color: gray;
      color: white;
      cursor: pointer;
    }

    .tower.item3 {
      height: 38px;
      border: 0;
      background-color: #fff;
      width: 155px;
    }

    .tower.item4 {
      height: 38px;
      border: 0;
      background-color: #fff;
      cursor: auto;
    }

    .tower.item5 {
      height: 38px;
      width: 140px;
      border: 0;
      background-color: #fff;
      cursor: auto;
    }

    .tower.item1.selected {
      background-color: lightblue;
    }
    /* 選中塔位：與選中的棟別使用相同顏色 */
    .tower.tower-selected {
      background-color: lightblue !important;
      border-color: #999 !important;
      color: inherit;
    }


    .bgWhite {
      background-color: white !important;
      border-color: white;
    }

    #informationBox { display:none; width:100%; margin-top:30px; box-sizing:border-box; }
    .information-content { width:100%; display:flex; flex-direction:row; align-items:flex-start; gap:30px; padding:25px; box-sizing:border-box; border:1px solid #ddd; border-radius:10px; background:#fff; }
    .information-photo { flex:0 0 40%; text-align:center; }
    .information-photo img { width:100%; max-width:500px; height:auto; display:block; margin:0 auto; object-fit:contain; }
    .information-text { flex:1; min-width:0; line-height:1.8; font-size:16px; word-break:break-word; }

    /* =========================
       手機版
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 10px;
      }

      .floor1 {
        width: 100%;
      }

      #zones {
        overflow-x: auto;
      }
      /* 手機版：照片與生平說明改為上下排列 */
      .information-content {
        flex-direction: column;
        gap: 20px;
        padding: 15px;
      }

      .information-photo {
        flex: none;
        width: 100%;
      }

      .information-photo img {
        width: 100%;
        max-width: 100%;
      }

      .information-text {
        width: 100%;
        flex: none;
      }


      .upCode-col-0 {
        left: 16px;
      }
      .upCode-col-1 {
        left: 122px;
      }
      .upCode-col-2 {
        left: 228px;
      } 

    }

  </style>
</head>


<body>

  <!-- =========================
       棟別選擇
  ========================= -->

  <div class="floor floor1">

    <div class="tower item5">&nbsp;</div>

    <div class="tower item2 forefatherBox bgWhite">
      十三世<br>
      曾慈順
    </div>

    <div class="tower item2 forefatherBox bgWhite">
      十三世<br>
      林期爪
    </div>

    <div class="tower item5">&nbsp;</div>

  </div>


  <div class="floor floor1">

    <div class="tower item1" data-zone="B">
      B棟
    </div>

    <div class="tower item2 forefatherBox bgWhite">
      十四世<br>
      江謚梅
    </div>

    <div class="tower item2 forefatherBox bgWhite">
      十四世<br>
      林汝禮
    </div>

    <div class="tower item1 selected" data-zone="A">
      A棟
    </div>

  </div>


  <div class="floor floor1">

    <div class="tower item1" data-zone="D">
      D棟
    </div>

    <div class="tower item3">
      走
    </div>

    <div class="tower item1" data-zone="C">
      C棟
    </div>

  </div>


  <div class="floor floor1">

    <div class="tower item1" data-zone="F">
      F棟
    </div>

    <div class="tower item3">
      道
    </div>

    <div class="tower item1" data-zone="E">
      E棟
    </div>

  </div>


  <div class="floor floor1">

    <div class="tower item4">&nbsp;</div>
    <div class="tower item4">&nbsp;</div>
    <div class="tower item4">&nbsp;</div>
    <div class="tower item4">入口</div>

  </div>


  <!-- =========================
       塔位顯示區
  ========================= -->

  <div id="zones"></div>

  <div id="informationBox"></div>


  <script>

    /* =========================
       原本資料變數
    ========================= */

    const taken = new Set();

    const prices = {};

    const towerCodes = {};

    let forefathers = [];

    const towerColNums = {};

    const bookings = [];

    const informations = {};

    const photos = {};

    let activeInformationCode = null;
    /* 目前選中的塔位 */
    let selectedTowerCode = null;

    function showInformation(code) {

      const informationBox = document.getElementById('informationBox');

      /* 同一塔位再次點擊：取消照片與生平資料 */
      if (activeInformationCode === code) {
        activeInformationCode = null;
        informationBox.innerHTML = '';
        informationBox.style.display = 'none';
        return;
      }

      let targetZone = null;
      let targetIndex = -1;  

      for (const zone in towerCodes) {
        const index = towerCodes[zone].findIndex(
          towerCode => String(towerCode) === String(code)
        );
        if (index !== -1) {
          targetZone = zone;
          targetIndex = index;
          break;
        }
      }

      // if (targetZone === null || targetIndex === -1) {
      //   activeInformationCode = null;
      //   informationBox.innerHTML = '';
      //   informationBox.style.display = 'none';
      //   return;
      // }

      const information =
        informations[targetZone] &&
        informations[targetZone][targetIndex] !== undefined
          ? informations[targetZone][targetIndex] : '';

      const photo =
        photos[targetZone] &&
        photos[targetZone][targetIndex] !== undefined
          ? photos[targetZone][targetIndex] : '';  

      activeInformationCode = code;

      const photoHTML = photo ? `
        <div class="information-photo">
          <img src="${photo}" alt="${code}"
              onerror="this.parentElement.style.display='none'">
        </div>` : '';

      const informationHTML = information ? `
        <div class="information-text">
          ${String(information).replace(/\n/g, '<br>')}
        </div>` : '';

      informationBox.innerHTML = `
        <div class="information-content">
          ${photoHTML}
          ${informationHTML}
        </div>`;

      informationBox.style.display = 'block';

      // ========== 新增：滾動到照片位置 ==========
      setTimeout(() => {
        informationBox.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }, 100);
      // ========================================
    }


    /* =========================
       顯示指定棟別
    ========================= */

    function renderZone(zone) {

      document.getElementById('zones').innerHTML = '';
      activeInformationCode = null;
      const informationBox = document.getElementById('informationBox');
      informationBox.innerHTML = '';
      informationBox.style.display = 'none';

      if (zone) {
        createZone(zone);
      }

    }


    /* =========================
       建立塔位
       直接保留原本主要邏輯
    ========================= */

    function createZone(zone) {

      const container = document.createElement('div');

      container.className = 'tower-zone';


      /* 棟別標題 */

      const label = document.createElement('div');

      label.className = 'zone-label';

      label.textContent = `${zone}棟`;

      container.appendChild(label);


      /* =========================
         祖先資料顯示
      ========================= */
      forefathers = prices['M']
      if (!forefathers[2] && !forefathers[3]) {

        const boxes = document.querySelectorAll('.forefatherBox');

        boxes[0].innerHTML = '未填寫';

        boxes[1].innerHTML = '未填寫';

        boxes[2].innerHTML =
          forefathers[0]?.replace(/B/g, '<br>') || '未填寫';

        boxes[3].innerHTML =
          forefathers[1]?.replace(/B/g, '<br>') || '未填寫';

        boxes[2].classList.remove('bgWhite');

        boxes[3].classList.remove('bgWhite');

        let boxIndex = 0
        boxes.forEach((box, index) => {
          box.addEventListener('click', (e) => {
              const target = e.currentTarget; // 指向被点击的 box

              boxIndex = index - 2;
              document.querySelectorAll('.tower.tower-selected').forEach(t => {
                t.classList.remove('tower-selected');
              });
              target.classList.add('tower-selected');
              showInformation(towerCodes['M'][boxIndex]);
          });
        });

      } else {

        const boxes = document.querySelectorAll('.forefatherBox');

        for (let i = 0; i < boxes.length; i++) {

          boxes[i].innerHTML =
            forefathers[i]?.replace(/B/g, '<br>') || '未填寫';

          boxes[i].classList.remove('bgWhite');

        }

        boxes.forEach((box, index) => {
          box.addEventListener('click', (e) => {
            const target = e.currentTarget; // 指向被点击的 box  
            document.querySelectorAll('.tower.tower-selected').forEach(t => {
              t.classList.remove('tower-selected');
            });
            target.classList.add('tower-selected');
            showInformation(towerCodes['M'][index]);
          });
        });

      }


      /* =========================
         原本總塔位計算
      ========================= */

      let totalSlots = 15;

      const rows = 5;


      if (towerColNums[zone]) {

        totalSlots =
          towerColNums[zone][0]
            ? towerColNums[zone][0]
            : 0;

      }


      let towerColNumsIndex = 0;

      let towerColNumsTotal = 0;


      /* =========================
         5樓 → 1樓
      ========================= */ 

      for (let row = 0; row < rows; row++) {

        const rowDiv = document.createElement('div');

        rowDiv.className = 'floor';

        rowDiv.style.display = 'flex';

        rowDiv.style.alignItems = 'center';

        rowDiv.style.marginBottom = '5px';


        /* 樓層 */

        const floorLabel = document.createElement('div');

        floorLabel.style.width = '60px';

        floorLabel.style.display = 'flex';

        floorLabel.style.alignItems = 'center';

        floorLabel.style.justifyContent = 'center';

        floorLabel.style.fontWeight = 'bold';

        floorLabel.textContent = `${5 - row}樓`;

        rowDiv.appendChild(floorLabel);


        /* 每層塔位數 */

        towerColNumsIndex = row + 1;


        const cols =
          towerColNums[zone][towerColNumsIndex]
            ? towerColNums[zone][towerColNumsIndex]
            : 3;


        /* 保留原本寬度 */

        const towerWidth =
          cols == 4
            ? '70px'
            : '96px';


        const towerHeight = '70px';


        /* =========================
           原本資料索引方式
        ========================= */

        let dataIndices = [];


        if (cols == 4) {

          dataIndices = [

            towerColNumsTotal,
            towerColNumsTotal + 1,
            towerColNumsTotal + 2,
            towerColNumsTotal + 3

          ];

        } else {

          dataIndices = [

            towerColNumsTotal,
            towerColNumsTotal + 1,
            towerColNumsTotal + 2

          ];

        }


        towerColNumsTotal =
          towerColNumsTotal +
          towerColNums[zone][towerColNumsIndex];


        /* =========================
           建立每個塔位
        ========================= */

        for (let col = 0; col < cols; col++) {

          const index = dataIndices[col];


          if (index >= totalSlots) {
            break;
          }


          const defaultCode =
            `${zone}${(index + 1)
              .toString()
              .padStart(2, '0')}`;


          let code =
            towerCodes[zone] &&
            towerCodes[zone][index] !== undefined

              ? towerCodes[zone][index]

              : defaultCode;


          /* 包裝 */

          const wrapper =
            document.createElement('div');


          wrapper.className = 'tower-wrapper';

          wrapper.style.marginRight = '5px';

          wrapper.style.display = 'flex';

          wrapper.style.flexDirection = 'column';

          wrapper.style.alignItems = 'center';


          /* 塔位 */

          const tower =
            document.createElement('div');


          tower.className = 'tower';

          tower.dataset.code = code;

          tower.dataset.zone = zone;
          /* 目前選中的塔位使用與選中棟別相同的顏色 */
          if (selectedTowerCode !== null &&
              String(selectedTowerCode) === String(code)) {
            tower.classList.add('tower-selected');
          }


          tower.style.width = towerWidth;

          tower.style.height = towerHeight;


          /* =========================
             讀取價格 / 狀態
          ========================= */

          const hasPrice = prices[zone] && prices[zone][index] !== undefined;
          let price = hasPrice ? prices[zone][index] : '';


          tower.dataset.price = price;


          const moneyMode =
            /^\d+(\.\d{2})?$/;


          const isMoney =
            moneyMode.test(price);


          /* =========================
             原本 5樓、3樓下方框
          ========================= */

          let bottomBox = null;


          if (row == 0 || row == 2) {

            bottomBox =
              document.createElement('div');


            bottomBox.style.height = '12px';

            bottomBox.style.border =
              '3px solid gray';

            bottomBox.style.marginBottom =
              '30px';

            bottomBox.style.marginTop =
              '5px';

            bottomBox.style.width =
              '100%';

            bottomBox.style.borderRadius =
              '2px';

          }


          /* =========================
             已選
          ========================= */

          if (taken.has(code)) {
              //  tower.classList.add('taken');
               tower.innerHTML = `${code}<br>已選`;             

          } else if (!hasPrice) {
              // 沒有價格資料：保留位置，但完全空白
              tower.classList.add('empty-slot');
              tower.style.backgroundColor = 'transparent';
              tower.style.border = 'none';
              tower.style.color = 'transparent';
              tower.style.cursor = 'default';
              tower.innerHTML = '';
              tower.onclick = null;              

          } else if (!isMoney) {
              // tower.classList.add('noselected');

              tower.addEventListener('click', function () {
                selectedTowerCode = code;

                document.querySelectorAll('.tower.tower-selected').forEach(t => {
                  t.classList.remove('tower-selected');
                });
                this.classList.add('tower-selected');

                showInformation(code);
              });

            let tempPriceArr =
              String(price).split('B');


            if (tempPriceArr.length > 1) {

              price =
                tempPriceArr.join('<br>');

            }


            tower.innerHTML =
              `${code}<br>${price}`;


            /* R 預定狀態 */

            if (String(price).indexOf('R') > -1) {

              tower.classList.add('red');

              tower.style.backgroundColor = 'pink';

              tower.style.color = 'red';

              tower.innerHTML =
                `${code}<br>` +
                String(price).replace('R', '<br>');

            }

            /* =========================
               上下合併塔位
            ========================= */

            if (row == 2 || row == 4) {
              
              const upIndex =
                index - cols;


              if (upIndex > 0) {

                const upCode =
                  towerCodes[zone] &&
                  towerCodes[zone][upIndex] !== undefined

                    ? towerCodes[zone][upIndex]

                    : '';


                if (upCode == code) {

                  tower.innerHTML = '';

                  tower.classList.add('downCode');

                } else {
                  const hasPrice = prices[zone] && prices[zone][upIndex] !== undefined;
                  if (!hasPrice) {
                    tower.style.marginTop = '-6px';
                  } else {
                    tower.style.height = '64px';
                    console.log('shuaiquan')
                  }
                }

              }

            }


            if (row == 1 || row == 3) {

              const downIndex =
                index + cols;


              if (downIndex < totalSlots) {

                const downCode =
                  towerCodes[zone] &&
                  towerCodes[zone][downIndex] !== undefined

                    ? towerCodes[zone][downIndex]

                    : '';
                
                if (downCode == code) {

                  const tower1 = document.createElement('div');


                  tower1.className = 'tower';
                  tower1.dataset.code = code;
                  tower1.dataset.zone = zone;
                  tower1.style.width = towerWidth;
                  tower1.style.height = towerHeight;  
                  wrapper.appendChild(tower1);

                  tower.innerHTML = '<div class="codeVerticalY">' + tower.innerHTML + '</div>';
                  tower.classList.add('upCode');
                  tower.classList.add('upCode-col-'+col);
                  tower.style.top = row == 1 ? '165px' : '362px';
                  // tower.style.left = col == 1 ? '166px' : (col == 2 ? '272px' : '60px');

                } else {
                  tower.style.marginTop = '-6px';
                }

              }

            }


          /* =========================
             正常金額塔位
          ========================= */

          } else {

            const priceStr =
              Number(price).toLocaleString();


            tower.innerHTML =
              `${code}<br>` +
              `<span class="price">${priceStr}</span>`;


            if (row == 1 || row == 3) {

              tower.style.marginTop = '-7px';
            }  

          }


          wrapper.appendChild(tower);


          /* 加入下方框 */

          if (bottomBox) {

            wrapper.appendChild(bottomBox);

          }


          rowDiv.appendChild(wrapper);

        }


        container.appendChild(rowDiv);

      }


      document
        .getElementById('zones')
        .appendChild(container);

    }


    /* =========================
       棟別點擊
    ========================= */

    const elements =
      document.querySelectorAll('.item1');


    elements.forEach(element => {

      element.addEventListener('click', function () {

        elements.forEach(nav => {
          nav.classList.remove('selected');
        });

        /* 換棟別時清除上一棟選中的塔位 */
        selectedTowerCode = null;
        document.querySelectorAll('.tower.tower-selected').forEach(t => {
          t.classList.remove('tower-selected');
        });

        this.classList.add('selected');


        renderZone(
          this.dataset.zone
        );

      });

    });


    /* =========================
       直接讀取原本塔位 Excel
    ========================= */

    async function loadExcelFromDrive() {

      const fileId =
        '17bZEcF5kuALMJV44dD90s9gttx9IAh0nRlUPmPQbfkY';


      const downloadUrl =
        'https://docs.google.com/spreadsheets/d/' +
        fileId +
        '/export?';


      try {

        const res =
          await fetch(downloadUrl);


        if (!res.ok) {

          throw new Error(
            `HTTP ${res.status}`
          );

        }


        const blob =
          await res.blob();


        const arrayBuffer =
          await blob.arrayBuffer();


        const workbook =
          XLSX.read(
            arrayBuffer,
            {
              type: 'array'
            }
          );


        /* 保留原本第 3 個工作表 */

        const sheetName =
          workbook.SheetNames[2];


        const sheet =
          workbook.Sheets[sheetName];


        const sheetData =
          XLSX.utils.sheet_to_json(
            sheet,
            {
              header: 1
            }
          );


        return sheetData;


      } catch (err) {

        console.error(
          '讀取失敗：',
          err
        );


        document.getElementById('zones').innerHTML =
          '<p style="color:red;">塔位資料讀取失敗，請確認 Google 試算表是否允許讀取。</p>';

      }

    }


    /* =========================
       讀取資料並建立塔位
       保留原本資料欄位結構
    ========================= */

    async function main() {

      const sheetData =
        await loadExcelFromDrive();


      if (!sheetData) {
        return;
      }


      sheetData.forEach(
        (
          [
            key,
            value,
            code,
            information,
            photo,
            f,
            g,
            h,
            towerColNum,
            j,
            booking
          ]
        ) => {


          /* 價格 / 狀態 */

          if (!prices[key]) {

            prices[key] = [];

          }

          prices[key].push(value);

          if (!informations[key]) {

            informations[key] = [];

          }

          informations[key].push(information);

          if (!photos[key]) {

            photos[key] = [];

          }

          photos[key].push(photo); 


          /* 塔位號碼 */

          if (!towerCodes[key]) {

            towerCodes[key] = [];

          }

          towerCodes[key].push(code);          


          /* 每層塔位數 */

          if (!towerColNums[key]) {

            towerColNums[key] = [];

          }


          if (towerColNum) {

            towerColNums[key].push(
              parseInt(
                towerColNum,
                10
              )
            );

          }


          /* 預定設定 */

          bookings.push(
            parseInt(
              booking,
              10
            )
          );

        }
      );


      /* 保留原本反轉方式 */

      for (let key in towerColNums) {

        towerColNums[key].reverse();

      }


      /* 預設顯示 A棟 */

      renderZone('A');

    }


    /* =========================
